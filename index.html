<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DÉBLOQUÉ - Performance Mentale</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DÉBLOQUÉ">
    <meta name="theme-color" content="#0C1430">
    <link rel="apple-touch-icon" href="EM.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'DM Sans', sans-serif;
            background: #000;
            overflow: hidden;
        }
        .font-syne { font-family: 'Syne', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse-slow { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.05); } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .animate-fadeIn { animation: fadeIn 0.8s ease-in-out; }
        .animate-pulse-slow { animation: pulse-slow 2.5s ease-in-out infinite; }
        .animate-slideUp { animation: slideUp 0.6s ease-out; }
        
        .kinetic-gradient { background: linear-gradient(135deg, #a43d00 0%, #ff6c1e 100%); }
        .glass-panel {
            background: rgba(18, 26, 54, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        @keyframes pulse-record { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239,68,68,0.4); } 50% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(239,68,68,0); } }
        @keyframes wave { 0%,100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }
        .animate-pulse-record { animation: pulse-record 1.2s ease-in-out infinite; }
        .wave-bar { animation: wave 0.8s ease-in-out infinite; transform-origin: bottom; }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.2s; }
        .wave-bar:nth-child(6) { animation-delay: 0.1s; }
    </style>
</head>
<body>
    <div id="app" class="min-h-screen flex items-center justify-center"></div>

    <script>
        // ===== DATA & STATE =====
        const APP_VERSION = '2.7'; // Incrémente à chaque changement de structure
        
        let state = {
            appVersion: APP_VERSION,
            currentView: 'splash',
            user: null,
            profile: null,
            onboardingStep: 0,
            selectedRole: 'joueur',
            formData: { name: '', email: '', password: '' },
            selectedOutil: null,
            carnetData: {
                intention: '',
                tool: '',
                humor: '😌',
                victory: '',
                emotions: '',
                improvement: '',
                sharedWithParent: true
            },
            masteredTools: [],
            synergyCodeInput: '',
            linkedProfiles: [],
            chatTargetUid: null
        };

        const OUTILS = [
            {n:'01',t:'La Ferrari & les freins',ch:'Chapitre 1',w:'Comprendre pourquoi tu bloques',why:'Dans ton cerveau, deux systèmes travaillent ensemble. La Ferrari (amygdale) réagit en une fraction de seconde. Les freins (cortex préfrontal) ne seront complets qu\'à 25 ans. Ce n\'est pas une faiblesse — c\'est de la biologie.',steps:['Identifie ta Ferrari : quand est-ce qu\'elle démarre dans le match ?','Nomme l\'émotion : "Ma Ferrari s\'emballe. C\'est normal. Je pars jouer, pas à la guerre."','Ramène ton attention sur quelque chose de concret : la musique, le paysage, la sensation de tes pieds.']},
            {n:'02',t:'Le match fantôme',ch:'Chapitre 2',w:'La veille · Dans la voiture',why:'Le match ne commence pas au coup d\'envoi. Dès la veille, ton cerveau simule — et il scénarise toujours en ta défaveur. Ce match fantôme consomme de l\'énergie réelle avant même que tu aies couru un km.',steps:['Repère les moments où le match fantôme démarre (voiture, lit, vestiaire).','Dis-toi : "Ma Ferrari s\'emballe. Je pars jouer, pas à la guerre."','Ramène ton cerveau dans le présent : musique, paysage, sensation des pieds dans les chaussures.']},
            {n:'03',t:'Le scan des voyants',ch:'Chapitre 3',w:'Dès qu\'une émotion monte',why:'La frustration, la peur, la colère — ce sont les voyants de ton tableau de bord. Ils t\'envoient une information précise. Apprends à les lire plutôt qu\'à les ignorer.',steps:['Inspiration profonde : "Qu\'est-ce que je ressens exactement ?"','Expiration : "Qu\'est-ce que ce signal essaie de me dire ?"','En reprenant ta course : "Quelle est la meilleure action possible maintenant ?"']},
            {n:'04',t:'La victoire verticale',ch:'Chapitre 4',w:'Après chaque séance',why:'La comparaison horizontale (regarder les autres) produit soit de l\'arrogance, soit du doute. La comparaison verticale (te comparer à toi d\'il y a 3 mois) construit de la vraie confiance.',steps:['Chaque soir, note 3 choses que TOI tu as mieux faites qu\'avant.','Pas mieux que les autres — mieux que la version de toi de la semaine dernière.','Écris-les. Ton cerveau a besoin de la preuve écrite.']},
            {n:'05',t:'Jouer pour toi',ch:'Chapitre 5',w:'Face au regard des autres',why:'Ton attention est une batterie. 30% partent surveiller ton père, 20% le coach, 15% tes coéquipiers. Il ne te reste que 35% pour jouer. C\'est ça le vrai problème.',steps:['Trouve ton mot d\'ancrage : un mot qui capture la sensation de jouer libre.','Dès que tu sens le regard peser, prononce ce mot mentalement. Une seule fois.','Ramène immédiatement ton attention sur l\'action concrète qui vient.']},
            {n:'06',t:'Le protocole 3R',ch:'Chapitre 6',w:'Frustration → énergie',why:'La frustration est l\'ombre de ton talent. Elle ne peut exister que parce que le talent existe. Les 3R transforment la vapeur en propulsion.',steps:['RECONNAÎTRE : "Je suis frustré. C\'est normal. J\'ai envie de réussir."','RELÂCHER : Un geste physique bref et personnel (expirer fort, secouer les mains).','REPARTIR : Une action concrète immédiate. Sprinte, demande le ballon, encourage.']},
            {n:'07',t:'La banque de confiance',ch:'Chapitre 7',w:'Après une série difficile',why:'Ton cerveau est un comptable. Il ne croit pas ce qu\'il entend — il croit ce qu\'il a vu se répéter. La vraie confiance vient de la preuve, pas des compliments.',steps:['Identifie le geste sur lequel tu manques de confiance.','Va sur le terrain, répète, répète encore. La banque se remplit dépôt par dépôt.','Chaque soir : note 3 dépôts — des efforts, pas des résultats.']},
            {n:'08',t:'Recadrer l\'échec',ch:'Chapitre 8',w:'Peur de rater · Peur de réussir',why:'L\'échec fonctionne comme un GPS : "recalcul en cours." C\'est une donnée de navigation, pas une sentence. Et la peur de réussir existe aussi.',steps:['"Qu\'est-ce qui se passe au pire si ça rate ?" (la réalité, pas la catastrophe imaginée)','"Est-ce que j\'ai déjà survécu à quelque chose d\'aussi difficile ?"','"Qu\'est-ce que ça m\'apprend si ça rate ?" Transforme en information utile.']},
            {n:'09',t:'Jouer pour l\'action',ch:'Chapitre 9',w:'Pression du résultat',why:'"Ne rate pas ce contrôle" — ton cerveau entend "rate ce contrôle." Le frein à main est tiré et tu demandes à la Ferrari d\'accélérer.',steps:['Définis 3 intentions de processus avant d\'entrer (pas de résultat).','Exemples : "Encourager après chaque erreur." "Sprinter sur chaque repli."','After the match : évalue sur tes intentions, pas sur le score.']},
            {n:'10',t:'La respiration',ch:'Chapitre 10',w:'Avant match · Mi-temps · Après erreur',why:'Tu as dans ta poitrine l\'outil mental le plus puissant. Tu l\'utilises 20 000 fois par jour sans jamais vraiment t\'en servir.',steps:['AVANT MATCH : 6 cycles de respiration 5/5 en faisant tes lacets.','APRÈS ERREUR : 3 respirations profondes par le ventre pendant ton replacement.','MI-TEMPS : 3 minutes de respiration abdominale avant d\'écouter le coach.']},
            {n:'11',t:'Se parler autrement',ch:'Chapitre 11',w:'Voix intérieure négative',why:'Tu te parles à toi-même d\'une façon que tu n\'accepterais jamais d\'un autre. Ni discours négatif, ni faux positif : le réalisme motivant.',steps:['"Est-ce un fait ou une interprétation ?" Tu gardes le fait, tu jettes l\'interprétation.','"Est-ce que cette pensée m\'aide à mieux jouer maintenant ?"','Si non : replace par une instruction d\'action concrète.']},
            {n:'12',t:'Surfer la vague',ch:'Chapitre 12',w:'Émotion forte · Sur le point d\'exploser',why:'Une émotion fonctionne comme une vague. Elle monte, atteint un pic, puis redescend. Bloquer la vague la rend plus forte. La surfer, c\'est garder le volant.',steps:['STOP : "Stop", "Calme", "Pilote". Ou un geste discret.','SWITCH : Une instruction technique concrète. "Cherche le premier appui."','Le cerveau occupé par une mission n\'a plus de carburant pour la colère.']},
            {n:'13',t:'Le laser de concentration',ch:'Chapitre 13',w:'Distraction · Pensées parasites',why:'La concentration n\'est pas l\'absence de distractions — c\'est la capacité de ramener ton laser encore et encore sur l\'essentiel.',steps:['Trouve ton mot déclencheur (Ballon / Scanner / Maintenant / Ici).','Pendant l\'échauffement : force ton laser sur un détail ultra-précis.','Dès que tu dériver : prononce ton mot avec autorité. Hop — laser rallumé.']},
            {n:'14',t:'La règle des 5 secondes',ch:'Chapitre 14',w:'Après une erreur',why:'Chaque seconde passée à baisser la tête après un raté est une seconde où ton cerveau est saturé d\'émotions négatives. 10 erreurs × 30 secondes = 5 minutes de fantôme sur le terrain.',steps:['Acceptation flash (2 sec) : "J\'ai raté." Un mot, pas "je suis nul."','Reset physique (2 sec) : Tête haute. Dos droit. Inspire profond par le ventre.','Switch vers l\'action (1 sec) : "Quelle est ma tâche maintenant ?"']},
            {n:'15',t:'Les 3 piliers de confiance',ch:'Chapitre 15',w:'Solidité intérieure durable',why:'La confiance n\'est pas un sentiment — c\'est un solde. Elle se bâtit sur 3 piliers : compétence prouvée, discours intérieur, visualisation.',steps:['Pilier 1 : Fais des dépôts quotidiens — effort invisible, répétition.','Pilier 2 : Parle-toi comme à un allié — réalistement motivant.','Pilier 3 : 2 minutes avant de dormir — visualise un geste précis.']},
            {n:'16',t:'Le curseur d\'énergie',ch:'Chapitre 16',w:'Fatigue mentale · Fin de match',why:'Il existe une fatigue invisible. Ce n\'est pas ton corps qui lâche — c\'est ton cerveau qui surchauffe. Chaque décision consomme une goutte de ton réservoir.',steps:['Repère les 3 vampires : multitâche permanent, stress chronique, manque de sommeil.','Aux arrêts de jeu : 30 secondes de reset (débranche / respire / relâche).','Automatise tout ce qui peut l\'être la veille : sac, horaires, playlist.']},
            {n:'17',t:'Le réglage feu/glace',ch:'Chapitre 17',w:'Trouver ton niveau d\'activation idéal',why:'Deux types de joueurs échouent : trop froid (invisible) et trop chaud (incontrôlable). Le champion est à 8/10 : agressif ET précis.',steps:['Évalue ton curseur de 1 à 10 pendant l\'échauffement.','Si tu es à 4 : active physiquement (sprints courts, duel).','Si tu montes à 9-10 : instructions techniques froides. "Centre de gravité bas."']},
            {n:'18',t:'Le scan d\'identité',ch:'Chapitre 18',w:'Chaque soir · 2 minutes',why:'Ton mental n\'est pas un outil de match — c\'est une identité. Elle se construit dans les petites décisions quotidiennes.',steps:['"Où ai-je agi comme un champion aujourd\'hui en dehors du foot ?"','"Quelle pensée parasite a essayé de prendre le contrôle et comment je l\'ai gérée ?"','"Si la version de moi que je veux devenir me regardait aujourd\'hui, serait-elle fière ?"']},
        ];

        // ===== LOCAL STORAGE =====
        function loadState() {
            const saved = localStorage.getItem('debloque_state');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    // Vérifier la version - si différente, effacer et recommencer
                    if (parsed.appVersion !== APP_VERSION) {
                        console.log('Version mismatch - clearing storage');
                        localStorage.removeItem('debloque_state');
                        // Garder le state initial avec splash
                        return;
                    }
                    state = { ...state, ...parsed };
                    // Toujours forcer splash au démarrage
                    state.currentView = 'splash';
                } catch (e) {
                    console.error('Error loading state:', e);
                    localStorage.removeItem('debloque_state');
                }
            }
        }

        function saveState() {
            localStorage.setItem('debloque_state', JSON.stringify(state));
        }

        // ===== UTILS =====
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-5 py-3 rounded-full text-sm font-semibold z-50 animate-fadeIn';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function generateCode(prefix) {
            const timestamp = Date.now().toString().slice(-4);
            const random = Math.floor(Math.random() * 10000).toString().padStart(4, '0');
            return prefix + '-' + timestamp + random.slice(0, 4 - timestamp.length);
        }

        // ===== RENDER =====
        function render() {
            const app = document.getElementById('app');
            
            if (state.currentView === 'splash') {
                app.innerHTML = renderSplash();
                // Auto-transition après 5 secondes (rallongé pour être sûr de le voir)
                setTimeout(() => {
                    // Si un profil existe, aller au dashboard, sinon aller à home
                    if (state.profile && state.user) {
                        state.currentView = 'dashboard';
                    } else {
                        state.currentView = 'home';
                    }
                    render();
                }, 5000);
            } else if (state.currentView === 'home') {
                app.innerHTML = renderHome();
            } else if (state.currentView === 'onboarding') {
                app.innerHTML = renderOnboarding();
            } else if (state.currentView === 'share-codes') {
                app.innerHTML = renderShareCodes();
            } else if (state.currentView === 'dashboard') {
                app.innerHTML = renderDashboard();
            } else if (state.currentView === 'outils') {
                app.innerHTML = renderOutils();
            } else if (state.currentView === 'outil-detail') {
                app.innerHTML = renderOutilDetail();
            } else if (state.currentView === 'carnet') {
                app.innerHTML = renderCarnet();
            } else if (state.currentView === 'messages') {
                app.innerHTML = renderMessages();
            } else if (state.currentView === 'chat-private') {
                app.innerHTML = renderChatPrivate();
            } else if (state.currentView === 'chat-broadcast') {
                app.innerHTML = renderChatBroadcast();
            } else if (state.currentView === 'synergie') {
                app.innerHTML = renderSynergie();
            } else if (state.currentView === 'profil') {
                app.innerHTML = renderProfil();
            } else if (state.currentView === 'vide-sac') {
                app.innerHTML = renderVideSac();
            } else if (state.currentView === 'aide-urgente') {
                app.innerHTML = renderAideUrgente();
            }

            attachEvents();
        }

        function renderSplash() {
            return `
                <div class="relative w-full max-w-[390px] h-screen mx-auto overflow-hidden flex flex-col bg-white items-center justify-center">
                    <div class="w-48 h-48 animate-pulse-slow animate-fadeIn">
                        <img src="./EM.svg" alt="Logo Exode Mental" class="w-full h-full object-contain drop-shadow-2xl" />
                    </div>
                </div>
            `;
        }

        function renderHome() {
            return `
                <div class="relative w-full max-w-[390px] h-screen mx-auto overflow-hidden flex flex-col bg-gradient-to-br from-gray-800 via-gray-900 to-gray-800 animate-fadeIn">
                    <div class="home-inner flex flex-col items-center justify-center h-full p-8 text-center relative overflow-hidden">
                        <div class="absolute w-80 h-80 bg-orange-500/30 rounded-full blur-3xl -top-20 -right-12 animate-pulse-slow"></div>
                        <div class="absolute w-64 h-64 bg-blue-500/20 rounded-full blur-3xl bottom-20 -left-16 animate-pulse-slow"></div>
                        
                        <div class="w-32 h-32 mb-7 z-10 animate-pulse-slow">
                            <img src="./EM.svg" alt="Logo Exode Mental" class="w-full h-full object-contain drop-shadow-2xl" />
                        </div>

                        <h1 class="font-syne text-4xl font-black text-white tracking-tighter mb-2 z-10">DÉBLOQUÉ</h1>
                        <p class="text-sm text-white/45 leading-relaxed mb-10 max-w-xs z-10">Rien n'est plus important que ton mental</p>

                        <div class="text-xs font-bold text-white/30 uppercase tracking-widest mb-4 z-10">Qui es-tu ?</div>

                        <div class="flex flex-col gap-3 w-full mb-6 z-10 animate-slideUp">
                            <button onclick="selectRole('joueur')" class="flex items-center gap-3.5 bg-white/8 border border-white/15 rounded-2xl p-4 hover:border-orange-500/60 hover:bg-orange-500/15 transition-all active:scale-95 shadow-lg">
                                <div class="w-11 h-11 rounded-xl bg-orange-500/15 flex items-center justify-center text-2xl shrink-0">🏋️</div>
                                <div class="text-left flex-1">
                                    <div class="font-syne text-base font-bold text-white mb-0.5">Athlète</div>
                                    <div class="text-xs text-white/40 leading-tight">12–18 ans · Je veux débloquer mon mental</div>
                                </div>
                                <svg class="w-5 h-5 text-white/25" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                                </svg>
                            </button>

                            <button onclick="selectRole('parent')" class="flex items-center gap-3.5 bg-white/8 border border-white/15 rounded-2xl p-4 hover:border-blue-400/60 hover:bg-blue-500/15 transition-all active:scale-95 shadow-lg">
                                <div class="w-11 h-11 rounded-xl bg-blue-500/10 flex items-center justify-center text-2xl shrink-0">👨‍👦</div>
                                <div class="text-left flex-1">
                                    <div class="font-syne text-base font-bold text-white mb-0.5">Parent</div>
                                    <div class="text-xs text-white/40 leading-tight">J'accompagne sans peser sur ses épaules</div>
                                </div>
                                <svg class="w-5 h-5 text-white/25" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                                </svg>
                            </button>

                            <button onclick="selectRole('educ')" class="flex items-center gap-3.5 bg-white/8 border border-white/15 rounded-2xl p-4 hover:border-green-400/60 hover:bg-green-500/15 transition-all active:scale-95 shadow-lg">
                                <div class="w-11 h-11 rounded-xl bg-green-500/10 flex items-center justify-center text-2xl shrink-0">🔔</div>
                                <div class="text-left flex-1">
                                    <div class="font-syne text-base font-bold text-white mb-0.5">Éducateur</div>
                                    <div class="text-xs text-white/40 leading-tight">Coach · Entraîneur · Responsable sportif</div>
                                </div>
                                <svg class="w-5 h-5 text-white/25" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderOnboarding() {
            const role = state.selectedRole;
            const step = state.onboardingStep || 0;

            // Étape 0 : Manifeste (joueur seulement)
            if (step === 0 && role === 'joueur') {
                return `
                    <div class="relative w-full max-w-[390px] h-screen mx-auto overflow-hidden flex flex-col animate-fadeIn" style="background:#000;">
                        <div class="flex-1 flex flex-col justify-center px-8 py-12">
                            <div class="w-10 h-10 mb-8">
                                <img src="./EM.svg" alt="Logo" class="w-full h-full object-contain opacity-80" />
                            </div>
                            <div class="font-syne text-4xl font-black text-white leading-tight mb-6">
                                Le sport,<br>c'est 90%<br><span style="color:#FF6C1E">de mental.</span>
                            </div>
                            <div class="space-y-4 mb-10">
                                <p class="text-white/60 text-sm leading-relaxed">Ici, c'est ton vestiaire privé.</p>
                                <p class="text-white/80 text-sm leading-relaxed font-semibold">Tes doutes restent ici.<br>Tes colères restent ici.</p>
                                <p class="text-white/60 text-sm leading-relaxed">On t'aide juste à transformer ce bruit en force.</p>
                                <p class="text-white/40 text-sm leading-relaxed border-l-2 border-orange-500/50 pl-3">Tes parents ? Ils ne verront que ce que <em>tu</em> décides de leur montrer.</p>
                            </div>
                            <button onclick="onboardingStepNext()" class="w-full kinetic-gradient text-white rounded-2xl p-4 font-syne font-bold text-base shadow-lg active:scale-95 transition-all">
                                C'est parti →
                            </button>
                            <button onclick="backToHome()" class="w-full text-white/20 text-sm p-4 mt-2">← Changer de profil</button>
                        </div>
                    </div>
                `;
            }

            // Étape 1 : Identification (tous rôles)
            if ((step === 1 && role === 'joueur') || (step === 0 && role !== 'joueur')) {
                return `
                    <div class="relative w-full max-w-[390px] h-screen mx-auto overflow-hidden flex flex-col bg-gradient-to-br from-gray-800 via-gray-900 to-gray-800 p-8 pt-16 animate-fadeIn">
                        <div class="flex gap-1.5 justify-center mb-6">
                            ${role === 'joueur' ? `
                                <div class="h-1 w-5 rounded-full bg-orange-500/50"></div>
                                <div class="h-1 w-7 rounded-full bg-orange-500"></div>
                                <div class="h-1 w-5 rounded-full bg-white/20"></div>
                                <div class="h-1 w-5 rounded-full bg-white/20"></div>
                            ` : `
                                <div class="h-1 w-7 rounded-full bg-orange-500"></div>
                                <div class="h-1 w-5 rounded-full bg-white/20"></div>
                            `}
                        </div>
                        <div class="flex items-center gap-2.5 mb-7">
                            <div class="w-9 h-9"><img src="./EM.svg" alt="Logo" class="w-full h-full object-contain" /></div>
                            <div>
                                <div class="font-syne font-bold text-sm text-white">DÉBLOQUÉ</div>
                                <div class="text-xs text-white/35 uppercase tracking-wider">${role === 'joueur' ? 'Athlète' : role === 'parent' ? 'Parent' : 'Éducateur'}</div>
                            </div>
                        </div>
                        <h2 class="font-syne text-3xl font-black text-white leading-tight mb-2.5">Identification</h2>
                        <p class="text-sm text-white/45 leading-relaxed mb-7">Juste ton prénom, ton email et un mot de passe.</p>
                        <div class="flex-1">
                            <div class="mb-4">
                                <label class="text-xs font-bold text-white/30 uppercase tracking-widest mb-2 block">Ton prénom</label>
                                <input id="name-input" type="text" class="w-full bg-white border border-white/20 rounded-2xl p-3.5 px-4 text-sm text-gray-900 placeholder-gray-400 outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all" placeholder="Lucas, Emma, Kylian…" value="${state.formData.name}">
                            </div>
                            <div class="mb-4">

        function getMentalStats() {
            const checkins = state.totalCheckins || 0;
            const streak = state.checkinStreak || 0;
            const outils = state.masteredTools?.length || 0;
            const videsacs = state.videsacs?.length || 0;
            const base = 40;
            return {
                san: Math.min(99, base + Math.round(checkins * 1.5 + streak * 2)),
                foc: Math.min(99, base + Math.round(outils * 2.5 + checkins * 1)),
                con: Math.min(99, base + Math.round(outils * 2 + streak * 1.5)),
                res: Math.min(99, base + Math.round(videsacs * 3 + checkins * 1.2)),
                det: Math.min(99, base + Math.round(streak * 3 + outils * 1)),
                rea: Math.min(99, base + Math.round(checkins * 1.8 + videsacs * 2)),
            };
        }

        function getShieldTier(gen) {
            if (gen < 55) return { label: 'BRONZE', bg: '#CD7F32', ext: '#FFD700' };
            if (gen < 70) return { label: 'ARGENT', bg: '#8C8C9E', ext: '#FFFFFF' };
            if (gen < 85) return { label: 'OR', bg: '#C8A000', ext: '#FFFFFF' };
            return { label: 'ICONE', bg: '#6030B0', ext: '#FFD700' };
        }

        function renderProfil() {
            const role = state.profile?.role;
            const isJoueur = role === 'joueur';
            const photo = state.profile?.photo || null;
            const club = state.profile?.club || '';

            const stats = state.profile?.stats || { buts: 0, passes: 0, arrets: 0, matchs: 0 };
            const editMode = state.profilEditMode || false;
            const postes = ['Gardien','Défenseur central','Latéral droit','Latéral gauche','Milieu défensif','Milieu central','Milieu offensif','Ailier droit','Ailier gauche','Avant-centre','Attaquant'];
            const ms = getMentalStats();
            const gen = Math.round((ms.san + ms.foc + ms.con + ms.res + ms.det + ms.rea) / 6);
            const tier = getShieldTier(gen);

        }

        function renderWithLayout(content) {
            return `
                <div class="relative w-full max-w-[390px] h-screen mx-auto overflow-hidden flex flex-col bg-gray-50 shadow-2xl">

                            { id: 'outils', label: 'Outils', icon: 'M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z' },
                            { id: 'carnet', label: 'Carnet', icon: 'M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253' },

                            { id: 'profil', label: 'Profil', icon: 'M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z' }
                        ].map(item => `
                            <button onclick="navigateTo('${item.id}')" class="flex flex-col items-center gap-1 px-2 py-2 rounded-2xl cursor-pointer transition-all flex-1 ${state.currentView === item.id ? 'bg-orange-500/10' : ''}">
                                <svg class="w-5 h-5 ${state.currentView === item.id ? 'text-orange-500' : 'text-gray-600'}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${item.icon}"/>

        }

        // ===== EVENT HANDLERS =====
        function attachEvents() {
            const nameInput = document.getElementById('name-input');
            const emailInput = document.getElementById('email-input');
            const passwordInput = document.getElementById('password-input');
            if (nameInput) nameInput.addEventListener('input', (e) => state.formData.name = e.target.value);
            if (emailInput) emailInput.addEventListener('input', (e) => state.formData.email = e.target.value);
            if (passwordInput) passwordInput.addEventListener('input', (e) => state.formData.password = e.target.value);

            const carnetIntention = document.getElementById('carnet-intention');
            const carnetTool = document.getElementById('carnet-tool');
            const carnetVictory = document.getElementById('carnet-victory');
            const carnetEmotions = document.getElementById('carnet-emotions');
            const carnetImprovement = document.getElementById('carnet-improvement');
            if (carnetIntention) carnetIntention.addEventListener('input', (e) => state.carnetData.intention = e.target.value);
            if (carnetTool) carnetTool.addEventListener('input', (e) => state.carnetData.tool = e.target.value);
            if (carnetVictory) carnetVictory.addEventListener('input', (e) => state.carnetData.victory = e.target.value);
            if (carnetEmotions) carnetEmotions.addEventListener('input', (e) => state.carnetData.emotions = e.target.value);
            if (carnetImprovement) carnetImprovement.addEventListener('input', (e) => state.carnetData.improvement = e.target.value);

            const checkinIntention = document.getElementById('checkin-intention');
            if (checkinIntention) checkinIntention.addEventListener('input', (e) => {
                if (!state.checkinTemp) state.checkinTemp = {};
                state.checkinTemp.intention = e.target.value;
            });

            const synergyCodeInput = document.getElementById('synergy-code-input');
            if (synergyCodeInput) synergyCodeInput.addEventListener('input', (e) => state.synergyCodeInput = e.target.value);
        }

        // Global functions
        window.selectRole = function(role) {
            state.selectedRole = role;
            state.onboardingStep = 0;
            state.currentView = 'onboarding';
            render();
        };

        window.backToHome = function() {
            state.currentView = 'home';
            state.onboardingStep = 0;
            render();
        };

        window.onboardingStepNext = function() {
            state.onboardingStep = (state.onboardingStep || 0) + 1;
            render();
        };

        window.setPartageNiveau = function(niveau) {
            state.partageNiveau = niveau;
            render();
        };

        window.setOnboardingCheckin = function(key, val) {
            if (!state.onboardingCheckin) state.onboardingCheckin = { corps: 5, mental: 5 };
            state.onboardingCheckin[key] = parseInt(val);
            render();
        };

        window.onboardingNext = function() {
            if (!state.formData.name || !state.formData.email || !state.formData.password) {
                showToast('Remplis tous les champs.');
                return;
            }
            if (state.formData.password.length < 6) {
                showToast('Le mot de passe doit faire au moins 6 caractères.');
                return;
            }
            state.user = { uid: 'user_' + Date.now() };
            state.profile = {
                uid: state.user.uid,
                name: state.formData.name,
                email: state.formData.email,
                password: state.formData.password,
                role: state.selectedRole,
                codeParent: state.selectedRole === 'joueur' ? generateCode('ATH') : null,
                codeEducateur: state.selectedRole === 'educ' ? generateCode('EDU') : null,
                partageNiveau: state.partageNiveau || 'tendances',
                academy: 'Académie Ybengo',
                messages: []
            };
            saveState();
            saveToRegistry(state.profile);
            if (state.selectedRole === 'joueur') {
                state.onboardingStep = 2;
                render();
            } else {
                state.currentView = 'share-codes';
                render();
            }
        };

        window.finishOnboarding = function() {
            if (state.selectedRole === 'joueur' && state.onboardingCheckin) {
                state.todayCheckin = {
                    date: new Date().toDateString(),
                    humeur: Math.round((state.onboardingCheckin.corps + state.onboardingCheckin.mental) / 2),
                    emotion: 'Calme',
                    intention: 'Premier jour sur Débloqué'
                };
                state.totalCheckins = 1;
                state.checkinStreak = 1;
                state.lastCheckinDate = new Date().toDateString();
                saveState();
            }
            state.currentView = 'dashboard';
            render();
        };


        window.sendMessage = function() {
            const input = document.getElementById('message-input');
            const text = input?.value?.trim();
            
            if (!text) return;
            
            const linkedProfile = state.linkedProfiles.find(p => 
                (state.profile.role === 'joueur' && p.role === 'parent') || 
                (state.profile.role === 'parent' && p.role === 'joueur')
            );
            
            if (!linkedProfile) {
                showToast('Aucun profil lié');
                return;
            }
            
            const message = {
                id: 'msg_' + Date.now(),
                from: state.profile.uid,
                to: linkedProfile.uid,
                text: text,
                timestamp: Date.now(),
                read: false
            };
            
            if (!state.profile.messages) state.profile.messages = [];
            state.profile.messages.push(message);
            
            saveState();
            input.value = '';
            render();
            
            // Auto-scroll to bottom
            setTimeout(() => {
                const container = document.getElementById('messages-container');
                if (container) container.scrollTop = container.scrollHeight;
            }, 100);
        };

        window.openAthleteChat = function(athleteUid) {
            state.chatTargetUid = athleteUid;
            state.currentView = 'chat-private';
            render();
        };

        window.openTeamBroadcast = function() {
            state.chatTargetUid = 'team';
            state.currentView = 'chat-broadcast';
            render();
        };

        window.backToMessages = function() {
            state.chatTargetUid = null;
            state.currentView = 'messages';
            render();
        };

        window.sendPrivateMessage = function() {
            const input = document.getElementById('message-input');
            const text = input?.value?.trim();
            
            if (!text || !state.chatTargetUid) return;
            
            const message = {
                id: 'msg_' + Date.now(),
                from: state.profile.uid,
                to: state.chatTargetUid,
                text: text,
                timestamp: Date.now(),
                read: false
            };
            
            if (!state.profile.messages) state.profile.messages = [];
            state.profile.messages.push(message);
            
            saveState();
            input.value = '';
            render();
            
            setTimeout(() => {
                const container = document.getElementById('messages-container');
                if (container) container.scrollTop = container.scrollHeight;
            }, 100);
        };

        window.sendBroadcastMessage = function() {
            const input = document.getElementById('message-input');
            const text = input?.value?.trim();
            
            if (!text) return;
            
            const linkedAthletes = state.linkedProfiles.filter(p => p.role === 'joueur');
            
            linkedAthletes.forEach(athlete => {
                const message = {
                    id: 'msg_' + Date.now() + '_' + athlete.uid,
                    from: state.profile.uid,
                    to: athlete.uid,
                    text: text,
                    timestamp: Date.now(),
                    read: false,
                    broadcast: true
                };
                
                if (!state.profile.messages) state.profile.messages = [];
                state.profile.messages.push(message);
            });
            
            saveState();
            input.value = '';
            showToast(`Message envoyé à ${linkedAthletes.length} joueur${linkedAthletes.length > 1 ? 's' : ''} !`);
            backToMessages();
        };

        window.setCheckinHumeur = function(n) {
            if (!state.checkinTemp) state.checkinTemp = {};
            state.checkinTemp.humeur = n;
            render();
        };

        window.setCheckinEmotion = function(e) {
            if (!state.checkinTemp) state.checkinTemp = {};
            state.checkinTemp.emotion = e;
            render();
        };

        window.validateCheckin = function() {
            const intention = document.getElementById('checkin-intention')?.value?.trim() || '';
            if (!state.checkinTemp?.humeur) { showToast('Indique ton niveau d\'énergie.'); return; }
            if (!state.checkinTemp?.emotion) { showToast('Choisis ton émotion principale.'); return; }

            state.todayCheckin = {
                date: new Date().toDateString(),
                humeur: state.checkinTemp.humeur,
                emotion: state.checkinTemp.emotion,
                intention: intention
            };

            // ALERTE si humeur < 5
            if (state.checkinTemp.humeur < 5) {
                if (!state.alertes) state.alertes = [];
                state.alertes.push({
                    date: new Date().toDateString(),
                    humeur: state.checkinTemp.humeur,
                    emotion: state.checkinTemp.emotion,
                    nom: state.profile?.name || 'L\'athlète',
                    lu: false
                });
                showToast('⚠️ Ton parent a été alerté — il est là pour toi.');
            }

            // Mise à jour streak
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            if (state.lastCheckinDate === yesterday.toDateString()) {
                state.checkinStreak = (state.checkinStreak || 0) + 1;
            } else if (state.lastCheckinDate !== new Date().toDateString()) {
                state.checkinStreak = 1;
            }
            state.lastCheckinDate = new Date().toDateString();
            state.totalCheckins = (state.totalCheckins || 0) + 1;
            state.checkinTemp = null;

            saveState();
            showToast('Check-in validé ! +20 XP 🔥');
            render();
        };

        // ===== VIDE-SAC =====
        let vsTimer = null;
        let vsMediaRecorder = null;
        let vsChunks = [];

        window.toggleRecording = function() {
            if (state.vsRecording) {
                // Arrêter
                clearInterval(vsTimer);
                if (vsMediaRecorder && vsMediaRecorder.state !== 'inactive') vsMediaRecorder.stop();
                state.vsRecording = false;
                render();
            } else {
                // Démarrer
                state.vsElapsed = 0;
                state.vsRecording = true;
                render();

                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    vsChunks = [];
                    vsMediaRecorder = new MediaRecorder(stream);
                    vsMediaRecorder.ondataavailable = e => vsChunks.push(e.data);
                    vsMediaRecorder.onstop = () => {
                        const blob = new Blob(vsChunks, { type: 'audio/webm' });
                        const duration = state.vsElapsed;
                        if (!state.videsacs) state.videsacs = [];
                        // Garder uniquement les vide-sacs des dernières 24h
                        state.videsacs = state.videsacs.filter(v => Date.now() - v.timestamp < 86400000);
                        state.videsacs.unshift({ timestamp: Date.now(), duration, url: URL.createObjectURL(blob) });
                        state.vsRecorded = true;
                        state.vsRecording = false;
                        stream.getTracks().forEach(t => t.stop());
                        saveState();
                        render();
                    };
                    vsMediaRecorder.start();

                    vsTimer = setInterval(() => {
                        state.vsElapsed = (state.vsElapsed || 0) + 1;
                        if (state.vsElapsed >= 60) {
                            clearInterval(vsTimer);
                            vsMediaRecorder.stop();
                            return;
                        }
                        // Mettre à jour le timer affiché
                        const el = document.querySelector('.vs-timer');
                        if (el) el.textContent = state.vsElapsed + 's / 60s';
                    }, 1000);

                }).catch(() => {
                    // Micro non disponible - mode simulation
                    state.vsRecording = false;
                    vsTimer = setInterval(() => {
                        state.vsElapsed = (state.vsElapsed || 0) + 1;
                        if (state.vsElapsed >= 60) {
                            clearInterval(vsTimer);
                            if (!state.videsacs) state.videsacs = [];
                            state.videsacs.unshift({ timestamp: Date.now(), duration: 60 });
                            state.vsRecorded = true;
                            saveState();
                            render();
                            return;
                        }
                        render();
                    }, 1000);
                });
            }
        };

        window.handlePhotoUpload = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                state.profile.photo = e.target.result;
                saveState();
                render();
                showToast('Photo mise à jour !');
            };
            reader.readAsDataURL(file);
        };

        window.toggleProfilEdit = function() {
            state.profilEditMode = !state.profilEditMode;
            state.statsEditMode = false;
            render();
        };

        window.toggleStatsEdit = function() {
            state.statsEditMode = !state.statsEditMode;
            state.profilEditMode = false;
            render();
        };

        window.saveProfilInfos = function() {
            const club = document.getElementById('club-input')?.value?.trim();
            const poste = document.getElementById('poste-input')?.value;
            if (!state.profile.stats) state.profile.stats = { buts: 0, passes: 0, arrets: 0, matchs: 0 };
            if (club) state.profile.club = club;
            if (poste) state.profile.poste = poste;
            state.profilEditMode = false;
            saveState();
            saveToRegistry(state.profile);
            showToast('Profil mis à jour ✓');
            render();
        };

        window.saveStats = function() {
            const poste = state.profile?.poste;
            if (!state.profile.stats) state.profile.stats = { buts: 0, passes: 0, arrets: 0, matchs: 0 };
            if (poste === 'Gardien') {
                state.profile.stats.arrets = parseInt(document.getElementById('stat-arrets')?.value) || 0;
            } else {
                state.profile.stats.buts = parseInt(document.getElementById('stat-buts')?.value) || 0;
            }
            state.profile.stats.passes = parseInt(document.getElementById('stat-passes')?.value) || 0;
            state.profile.stats.matchs = parseInt(document.getElementById('stat-matchs')?.value) || 0;
            state.statsEditMode = false;
            saveState();
            showToast('Stats mises à jour ✓');
            render();
        };

        window.resetVideSac = function() {
            state.vsRecorded = false;
            state.vsElapsed = 0;
            render();
        };

        window.activerModeRecup = function() {
            const fin = Date.now() + 2 * 3600 * 1000;
            state.modeRecup = { actif: true, fin, nom: state.profile?.name || 'L\'athlète' };
            // Ajouter message automatique dans messages parent
            if (!state.profile.messages) state.profile.messages = [];
            state.profile.messages.push({
                id: 'recup_' + Date.now(),
                from: state.profile.uid,
                to: 'parent',
                text: `🛡️ ${state.profile?.name || 'L\'athlète'} a besoin de 2h de silence pour récupérer. Merci de ne pas débriefer le match maintenant.`,
                timestamp: Date.now(),
                read: false,
                systeme: true
            });
            saveState();
            showToast('🛡️ Mode récup activé — 2h de silence');
            render();
        };

        window.marquerAlerteLue = function() {
            if (state.alertes) state.alertes = state.alertes.map(a => ({...a, lu: true}));
            saveState();
            render();
        };

        window.toggleParentEdit = function() {
            state.parentEditMode = !state.parentEditMode;
            render();
        };

        window.updateParentInput = function(key, val, lblId, suffix) {
            if (!state.parentData) state.parentData = {};
            if (!state.parentData.semaine) state.parentData.semaine = {};
            state.parentData.semaine[key] = parseFloat(val);
            const el = document.getElementById(lblId);
            if (el) el.textContent = val + suffix;
        };

        window.setParentBool = function(key, val) {
            if (!state.parentData) state.parentData = {};
            if (!state.parentData.semaine) state.parentData.semaine = {};
            state.parentData.semaine[key] = val;
            render();
        };

        window.saveParentData = function() {
            if (!state.parentData) state.parentData = {};
            if (!state.parentData.semaine) state.parentData.semaine = {};
            const s = state.parentData.semaine;
            // Sauvegarder répartition du temps
            s.tSport = parseInt(document.getElementById('inp-sport')?.value) || 25;
            s.tEtudes = parseInt(document.getElementById('inp-etudes')?.value) || 35;
            s.tSocial = parseInt(document.getElementById('inp-social')?.value) || 20;
            s.tRep = parseInt(document.getElementById('inp-repos')?.value) || 20;
            // Historique sommeil
            if (!state.parentData.histoSommeil) state.parentData.histoSommeil = [7,7,7,7,7,7,7];
            state.parentData.histoSommeil.push(s.sommeil || 7);
            state.parentData.histoSommeil = state.parentData.histoSommeil.slice(-7);
            state.parentEditMode = false;
            saveState();
            showToast('Semaine enregistrée ✓');
            render();
        };

        window.navigateTo = function(view) {
            state.currentView = view;
            render();
        };

        window.openOutil = function(n) {
            state.selectedOutil = n;
            state.currentView = 'outil-detail';
            render();
        };

        window.validateTool = function(n) {
            const toolId = parseInt(n);
            if (!state.masteredTools.includes(toolId)) {
                state.masteredTools.push(toolId);
                saveState();
                showToast('Outil validé ! Dépôt ajouté.');
            }
            state.currentView = 'outils';
            render();
        };

        window.setHumor = function(emoji) {
            state.carnetData.humor = emoji;
            render();
        };

        window.saveCarnet = function() {
            saveState();
            showToast('Semaine sauvegardée ✓');
        };

        // Registre global des profils (simulé via une clé localStorage commune)
        function getGlobalRegistry() {
            try {
                return JSON.parse(localStorage.getItem('debloque_registry') || '{}');
            } catch(e) { return {}; }
        }

        function saveToRegistry(profile) {
            const registry = getGlobalRegistry();
            // Indexer par tous les codes du profil
            if (profile.codeParent) registry[profile.codeParent] = {
                uid: profile.uid, name: profile.name, role: profile.role,
                codeParent: profile.codeParent, codeEducateur: profile.codeEducateur
            };
            if (profile.codeEducateur) registry[profile.codeEducateur] = {
                uid: profile.uid, name: profile.name, role: profile.role,
                codeParent: profile.codeParent, codeEducateur: profile.codeEducateur
            };
            localStorage.setItem('debloque_registry', JSON.stringify(registry));
        }

        window.linkSynergy = function() {
            const input = document.getElementById('synergy-code-input');
            const code = (input?.value || state.synergyCodeInput || '').trim().toUpperCase();

            if (!code) {
                showToast('Entre un code valide.');
                return;
            }

            // Vérifier si déjà lié
            if (state.linkedProfiles.find(p => p.codeParent === code || p.codeEducateur === code)) {
                showToast('Ce profil est déjà lié !');
                return;
            }

            // Chercher dans le registre global
            const registry = getGlobalRegistry();
            const found = registry[code];

            if (!found) {
                showToast('Code introuvable. Vérifie avec l\'autre personne.');
                return;
            }

            if (found.uid === state.profile.uid) {
                showToast('Tu ne peux pas te lier à toi-même.');
                return;
            }

            // Vérifier compatibilité des rôles
            const myRole = state.profile.role;
            const theirRole = found.role;
            const validPairs = [
                ['parent', 'joueur'], ['joueur', 'parent'],
                ['educ', 'joueur'], ['joueur', 'educ']
            ];
            const isValid = validPairs.some(([a, b]) => a === myRole && b === theirRole);
            if (!isValid) {
                showToast('Ce code n\'est pas compatible avec ton rôle.');
                return;
            }

            // Lier le profil
            state.linkedProfiles.push(found);
            saveState();
            showToast(`✅ ${found.name} connecté${found.role === 'joueur' ? 'e' : ''} !`);
            if (input) input.value = '';
            state.synergyCodeInput = '';
            render();
        };

        window.copyCode = function(code) {
            const textToCopy = code || `Code Parent: ${state.profile?.codeParent}\nCode Éducateur: ${state.profile?.codeEducateur}`;
            navigator.clipboard.writeText(textToCopy);
            showToast('Code copié !');
        };

        window.logout = function() {
            if (confirm('Es-tu sûr de vouloir te déconnecter ?')) {
                localStorage.removeItem('debloque_state');
                state = {
                    currentView: 'splash',
                    user: null,
                    profile: null,
                    onboardingStep: 0,
                    selectedRole: 'joueur',
                    formData: { name: '', email: '' },
                    selectedOutil: null,
                    carnetData: {
                        intention: '',
                        tool: '',
                        humor: '😌',
                        victory: '',
                        emotions: '',
                        improvement: '',
                        sharedWithParent: true
                    },
                    masteredTools: [],
                    synergyCodeInput: '',
                    linkedProfiles: []
                };
                render();
            }
        };

        // ===== INIT =====
        loadState();
        render();

        // Enregistrement PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
